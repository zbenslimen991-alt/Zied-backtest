name: Independent 20-Coin Backtest Batches

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'Zero-based batch index (20 coins per run)'
        required: false
        default: '0'
        type: string
      retry_count:
        description: 'Internal retry counter (maximum 2 retries)'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  backtest-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false
    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "${RUNNER_TEMP}/batch-tests.log"

      - name: Run current 20-coin batch
        id: backtest
        working-directory: app
        env:
          FORCE_WEEKLY_BACKTEST: '1'
          BACKTEST_BATCH_SIZE: '20'
          BACKTEST_BATCH_INDEX: ${{ inputs.batch_index || '0' }}
        run: |
          set -o pipefail
          python okx_quant/weekly_backtest.py 2>&1 | tee "${RUNNER_TEMP}/batch-backtest.log"

      - name: Retry failed batch (up to 2 retries)
        if: failure() && inputs.retry_count != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_BATCH: ${{ inputs.batch_index || '0' }}
          RETRY_COUNT: ${{ inputs.retry_count || '0' }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          NEXT_RETRY=$((RETRY_COUNT + 1))
          gh workflow run independent-batch-backtest.yml --ref "$WORKFLOW_REF" -f batch_index="$CURRENT_BATCH" -f retry_count="$NEXT_RETRY"

      - name: Dispatch next independent 20-coin run
        if: success() && steps.backtest.outputs.is_last_batch == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_BATCH: ${{ steps.backtest.outputs.next_batch_index }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: gh workflow run independent-batch-backtest.yml --ref "$WORKFLOW_REF" -f batch_index="$NEXT_BATCH" -f retry_count=0

      - name: Run weekly Learning after final batch
        if: success() && steps.backtest.outputs.is_last_batch == 'true'
        working-directory: app
        run: |
          set -o pipefail
          python okx_quant/weekly_learning.py 2>&1 | tee "${RUNNER_TEMP}/batch-learning.log"

      - name: Upload batch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-backtest-batch-${{ inputs.batch_index || '0' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/batch-tests.log
            ${{ runner.temp }}/batch-backtest.log
            ${{ runner.temp }}/batch-learning.log
          if-no-files-found: ignore
          retention-days: 30
