name: Weekly Backtest

on:
  workflow_dispatch:

  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read
  actions: write

concurrency:
  group: zied-weekly-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Zied
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        working-directory: app
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          fi

      - name: Run Backtest
        working-directory: app
        env:
          FORCE_WEEKLY_BACKTEST: "1"
        run: |
          python okx_quant/weekly_backtest.py

      - name: Run Weekly Learning
        working-directory: app
        run: |
          python okx_quant/weekly_learning.py
