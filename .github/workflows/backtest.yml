name: Weekly Backtest + Learning

on:
  # Run a fresh backtest when this workflow definition is updated; this also
  # allows validating the latest application code and performance settings.
  push:
    paths:
      - '.github/workflows/backtest.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  weekly-backtest:
    runs-on: ubuntu-latest
    # GitHub-hosted Ubuntu runners are capped at 6 hours per job.
    # Leave a safety margin so cancellation can be handled cleanly.
    timeout-minutes: 350
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "${RUNNER_TEMP}/weekly-tests.log"

      - name: Run weekly Backtest
        working-directory: app
        env:
          FORCE_WEEKLY_BACKTEST: '1'
        run: |
          set -o pipefail
          python okx_quant/weekly_backtest.py 2>&1 | tee "${RUNNER_TEMP}/weekly-backtest.log"

      - name: Run weekly Learning
        if: success()
        working-directory: app
        run: |
          set -o pipefail
          python okx_quant/weekly_learning.py 2>&1 | tee "${RUNNER_TEMP}/weekly-learning.log"

      - name: Upload weekly logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-backtest-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/weekly-tests.log
            ${{ runner.temp }}/weekly-backtest.log
            ${{ runner.temp }}/weekly-learning.log
          if-no-files-found: ignore
          retention-days: 14
