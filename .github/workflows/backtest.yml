name: Monthly Backtest

on:
  schedule:
    # First day of each month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  monthly-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Shared across workflows so monthly backtest and daily learning never
    # write the shared portfolio/model state concurrently.
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "${RUNNER_TEMP}/monthly-tests.log"

      - name: Run monthly Backtest
        working-directory: app
        env:
          FORCE_WEEKLY_BACKTEST: '1'
        run: |
          set -o pipefail
          python okx_quant/weekly_backtest.py 2>&1 | tee "${RUNNER_TEMP}/monthly-backtest.log"

      - name: Upload monthly logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-backtest-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/monthly-tests.log
            ${{ runner.temp }}/monthly-backtest.log
          if-no-files-found: ignore
          retention-days: 30
